name: Dubizzle Car Monitor

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "run = normal check, test = send a test notification only"
        type: choice
        options: [run, test]
        default: run

permissions:
  contents: write

concurrency:
  group: dubizzle-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        working-directory: tools/dubizzle-monitor
        run: pip install -r requirements.txt

      - name: Run monitor
        working-directory: tools/dubizzle-monitor
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "test" ]; then
            python monitor.py --test
          else
            python monitor.py
          fi

      - name: Commit updated state
        if: github.event.inputs.mode != 'test'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tools/dubizzle-monitor/state/seen.json
          git diff --cached --quiet || git commit -m "Update dubizzle-monitor seen ads state"
          git push
